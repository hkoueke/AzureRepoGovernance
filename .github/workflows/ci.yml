name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hebdomadaire (lundi 04:00 UTC). NuGetAudit est réglé sur all/low : un avis
    # publié sur une dépendance, même transitive, fait échouer le restore SANS
    # aucune modification de code. Cette exécution le révèle sur son propre
    # rythme plutôt qu'au milieu d'une pull request.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installation du SDK .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # setup-dotnet(cache: true) exigerait un packages.lock.json, absent du dépôt.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GovernanceAuditor.sln

      # Aucun -warnaserror : Directory.Build.props promeut déjà tout
      # avertissement d'analyseur (Meziantou, AsyncFixer, Sonar) en erreur.
      - name: Build
        run: dotnet build GovernanceAuditor.sln --no-restore -c Release

      - name: Tests
        run: >
          dotnet test GovernanceAuditor.sln --no-build -c Release
          --logger trx
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # Un artefact jamais exécuté n'est pas un artefact vérifié. « --aide » sort
      # avant toute I/O réseau et avant la pause interactive : c'est le seul chemin
      # exerçable sur un agent Linux, mais il prouve que l'hôte démarre, que la
      # configuration se lie et que le processus rend bien 0.
      - name: Test de démarrage
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release \
            --project src/GovernanceAuditor.Console/GovernanceAuditor.Console.csproj \
            -- --aide

      - name: Publication des résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

  publish:
    name: Exécutable ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    # L'exécution hebdomadaire ne sert qu'à vérifier restore + tests.
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installation du SDK .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      # Sur une étiquette « v1.2.3 », l'exécutable doit annoncer 1.2.3 : une release
      # dont le binaire déclare une autre version est intraçable au support.
      # Hors étiquette, un suffixe de préversion évite de faire passer une build de
      # branche pour la version publiée.
      - name: Détermination de la version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_ARG=-p:VersionSuffix=ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      # IncludeNativeLibrariesForSelfExtract est ce qui rend l'exécutable
      # RÉELLEMENT unique : sans lui, les bibliothèques natives — dont les
      # données ICU, tirées par InvariantGlobalization=false — sont publiées
      # en DLL séparées à côté de l'exe.
      #
      # PublishTrimmed=false est délibéré : la configuration est liée par
      # réflexion (BindConfiguration, ValidateDataAnnotations, AddCommandLine)
      # et les six analyseurs sont résolus par injection de dépendances. Un
      # binaire élagué compilerait puis échouerait à l'exécution.
      - name: Publication auto-contenue mono-fichier
        run: >
          dotnet publish src/GovernanceAuditor.Console/GovernanceAuditor.Console.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          $VERSION_ARG
          -p:SourceRevisionId=$GITHUB_SHA
          -o out/${{ matrix.rid }}

      # AssemblyName vaut GovernanceAuditor pour les deux RID : sans renommage
      # les deux exécutables entreraient en collision dans la release.
      - name: Renommage et empreinte SHA256
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "out/${{ matrix.rid }}/GovernanceAuditor.exe" "dist/GovernanceAuditor-${{ matrix.rid }}.exe"
          cd dist
          sha256sum "GovernanceAuditor-${{ matrix.rid }}.exe" > "GovernanceAuditor-${{ matrix.rid }}.exe.sha256"
          ls -lh

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: GovernanceAuditor-${{ matrix.rid }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Récupération des exécutables
        uses: actions/download-artifact@v4
        with:
          pattern: GovernanceAuditor-win-*
          path: dist
          merge-multiple: true

      # appsettings.json du dépôt n'est JAMAIS publié : il contient des valeurs
      # internes réelles. Seul le gabarit assaini accompagne la release.
      - name: Création de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/GovernanceAuditor-win-x64.exe
          dist/GovernanceAuditor-win-x64.exe.sha256
          dist/GovernanceAuditor-win-x86.exe
          dist/GovernanceAuditor-win-x86.exe.sha256
          src/GovernanceAuditor.Console/appsettings.sample.json
